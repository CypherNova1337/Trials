[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scryer"
version = "1.0.0"
description = "Deep, adaptive recon toolkit for CTF and lab environments"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "VoidSec-Hub" }]
keywords = ["recon", "ctf", "htb", "security", "enumeration", "pentest"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

# Core runs on the standard library alone. External tools (nmap, smbclient,
# dig, rpcclient, mongosh) are used opportunistically when present on PATH.
dependencies = []

[project.scripts]
scryer = "scryer.__main__:main"

[project.urls]
Homepage = "https://github.com/CypherNova1337/Trials"

[tool.setuptools.packages.find]
include = ["scryer*"]
